<!doctype html>
<html lang="th">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"></head>
<body style="margin:0">
<title>Tripster Flow Wireframes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#F1F3F6; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --ink:#1B2430; --ink-2:#5A6675; --ink-3:#8C97A5;
  --line:#DEE3EA; --line-2:#C7CFDA;
  --accent:#D95A0F; --accent-soft:#FBEEE4;
  --wire:#E8EBF0; --wire-line:#C6CDD7; --wire-ink:#7C8797; --wire-solid:#AEB8C6; --wire-deep:#D3D9E1;
  --shadow:0 1px 2px rgba(27,36,48,.06),0 14px 30px -22px rgba(27,36,48,.5);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0A0F16; --surface:#141B25; --surface-2:#1A222E;
  --ink:#E9EEF5; --ink-2:#A6B2C0; --ink-3:#78848F;
  --line:#242E3B; --line-2:#33404F;
  --accent:#FF9A4D; --accent-soft:#33210F;
  --wire:#1E2734; --wire-line:#384555; --wire-ink:#8593A3; --wire-solid:#465565; --wire-deep:#2A3543;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 14px 30px -22px rgba(0,0,0,.9);
}}
:root[data-theme="dark"]{
  --ground:#0A0F16; --surface:#141B25; --surface-2:#1A222E;
  --ink:#E9EEF5; --ink-2:#A6B2C0; --ink-3:#78848F;
  --line:#242E3B; --line-2:#33404F;
  --accent:#FF9A4D; --accent-soft:#33210F;
  --wire:#1E2734; --wire-line:#384555; --wire-ink:#8593A3; --wire-solid:#465565; --wire-deep:#2A3543;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 14px 30px -22px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:'IBM Plex Sans Thai','IBM Plex Sans',system-ui,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;line-height:1.28;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
code,.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:272px 1fr;gap:0;min-height:100vh;max-width:1560px;margin:0 auto}
@media (max-width:900px){.shell{grid-template-columns:1fr}}

.side{border-right:1px solid var(--line);background:var(--surface);padding:26px 0 40px;min-width:0}
@media (max-width:900px){.side{border-right:0;border-bottom:1px solid var(--line);padding:16px 0 12px;position:sticky;top:0;z-index:20}}
.brand{padding:0 22px 18px}
.brand .kick{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600}
.brand h1{font-family:'Baloo 2','IBM Plex Sans Thai',sans-serif;font-weight:800;font-size:22px;margin-top:5px}
.brand p{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.nav-cap{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding:0 22px 8px}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 12px}
@media (max-width:900px){
  .nav{flex-direction:row;overflow-x:auto;gap:7px;padding:0 16px 4px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav-cap{display:none}
  .brand{padding:0 16px 12px}
}
.nav{min-width:0}
.nav button{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--ink-2);flex:none;white-space:nowrap;transition:background .12s}
.nav button:hover{background:var(--surface-2)}
.nav button .no{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--ink-3);width:17px;flex:none}
.nav button .tx{font-size:14px;font-weight:500;line-height:1.3}
.nav button .ct{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-3);margin-left:auto}
@media (max-width:900px){.nav button .ct{display:none}}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--ink)}
.nav button[aria-current="true"] .no{color:var(--accent)}
.nav button[aria-current="true"] .tx{font-weight:600}
.side-foot{padding:22px 22px 0;margin-top:20px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3);line-height:1.7}
@media (max-width:900px){.side-foot{display:none}}
.side-foot i{display:inline-block;width:20px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:5px;border:1px solid var(--wire-line);background:var(--wire)}
.side-foot i.solid{background:var(--wire-solid);border-color:var(--wire-solid)}
.side-foot i.dash{background:transparent;border-style:dashed}
.side-foot i.deep{background:var(--wire-deep)}

/* ---------- panel ---------- */
.panel{padding:34px 30px 80px;min-width:0}
@media (max-width:640px){.panel{padding:24px 16px 60px}}
.p-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.p-id{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12px;color:#fff;background:var(--accent);border-radius:6px;padding:2px 8px}
.p-head h2{font-family:'Baloo 2','IBM Plex Sans Thai',sans-serif;font-weight:700;font-size:clamp(24px,3.4vw,32px)}
.p-goal{color:var(--ink-2);margin-top:8px;max-width:76ch}
.p-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;align-items:center}
.pill{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;border:1px solid var(--line-2);border-radius:6px;padding:2px 7px;color:var(--ink-2);background:var(--surface)}
.pill.br{border-style:dashed;color:var(--ink-3)}
.arrowtx{color:var(--ink-3);font-size:11px}

.strip-cap{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:30px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.strip{display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px}
.arrow{align-self:center;color:var(--line-2);font-size:18px;margin-top:-46px}
@media (max-width:560px){.arrow{display:none}
.card{width:100%;max-width:280px;margin:0 auto}
.strip{gap:22px}}
.card{width:224px;flex:none}
.card-hd{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.step{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;color:#fff;background:var(--ink);width:19px;height:19px;border-radius:50%;display:grid;place-items:center;flex:none}
.card-hd .sid{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;color:var(--accent)}
.card-hd .nm{font-size:13.5px;font-weight:600;line-height:1.25}
.cap{margin-top:9px;font-size:12.5px;color:var(--ink-2);line-height:1.55}
.cap .out{display:block;margin-top:4px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-3)}
.note{margin-top:26px;background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:11px 14px;font-size:13.5px;color:var(--ink-2);max-width:80ch}
.note b{color:var(--ink);font-weight:600}

/* ---------- phone ---------- */
.ph{border:1.5px solid var(--line-2);border-radius:18px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.ph-st{height:18px;background:var(--surface-2);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 9px;font-family:'IBM Plex Mono',monospace;font-size:8px;color:var(--ink-3)}
.ph-scr{padding:9px;display:flex;flex-direction:column;gap:6px;min-height:356px}
.wb{background:var(--wire);border:1px solid var(--wire-line);border-radius:7px;padding:7px 8px;font-size:10px;line-height:1.45;color:var(--wire-ink)}
.wb .t{display:block;font-weight:600;color:var(--ink-2);font-size:10.5px}
.wb.deep{background:var(--wire-deep);min-height:60px;display:flex;flex-direction:column;justify-content:flex-end}
.wb.img{background:var(--wire-deep);display:grid;place-items:center;min-height:46px;font-size:9.5px;text-align:center}
.wb.cta{background:var(--wire-solid);border-color:var(--wire-solid);color:var(--surface);text-align:center;font-weight:600;padding:8px}
.wb.ghost{background:transparent;border-style:dashed}
.wb.plain{background:var(--surface);border-color:var(--line)}
.grow{flex:1}
.ln{height:4.5px;border-radius:3px;background:var(--wire-line);margin-top:4px}
.w80{width:80%}.w30{width:30%}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.chip{font-size:9px;border:1px solid var(--wire-line);border-radius:20px;padding:1.5px 7px;color:var(--wire-ink);background:var(--surface)}
.chip.on{background:var(--wire-solid);border-color:var(--wire-solid);color:var(--surface)}
.lst{display:flex;gap:6px;align-items:center;margin-top:6px}
.sq{width:22px;height:22px;border-radius:5px;background:var(--wire-line);flex:none}
.lst .col{flex:1}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--surface-2)}
.tabs div{flex:1;text-align:center;font-size:7.6px;color:var(--ink-3);padding:6px 0;border-right:1px solid var(--line)}
.tabs div:last-child{border-right:0}
.tabs div.on{color:var(--accent);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}
.lip{height:3.5px;width:30px;border-radius:2px;background:var(--wire-line);margin:0 auto 3px}
.scap{font-family:'IBM Plex Mono',monospace;font-size:8px;color:var(--ink-3);text-align:center;letter-spacing:.06em}
</style>

<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="kick">Tripster · v2 public</div>
      <h1>Wireframe ตาม Flow</h1>
      <p>low-fidelity · จอมือถือ 390 × 844</p>
    </div>
    <div class="nav-cap">เลือก flow</div>
    <nav class="nav" id="nav" aria-label="รายการ flow"></nav>
    <div class="side-foot">
      <div><i></i>กล่องเนื้อหา</div>
      <div><i class="solid"></i>ปุ่มหลัก</div>
      <div><i class="dash"></i>ปุ่มรอง / คำอธิบาย</div>
      <div><i class="deep"></i>รูปภาพ</div>
    </div>
  </aside>
  <main class="panel" id="panel"></main>
</div>

<script>
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const chips = s => '<div class="chips">'+s.split(',').map(c=>{const on=c.endsWith('*');return '<span class="chip'+(on?' on':'')+'">'+esc(on?c.slice(0,-1):c)+'</span>';}).join('')+'</div>';
const rows = n => Array.from({length:+n},()=>'<div class="lst"><div class="sq"></div><div class="col"><div class="ln w80"></div><div class="ln w30"></div></div></div>').join('');
function block(spec){
  const [k,...a]=spec.split('|');
  const t=x=>x?'<span class="t">'+esc(x)+'</span>':'';
  switch(k){
    case 'H':  return '<div class="wb deep">'+t(a[0])+esc(a[1]||'')+'</div>';
    case 'B':  return '<div class="wb">'+t(a[0])+esc(a[1]||'')+'</div>';
    case 'BP': return '<div class="wb">'+t(a[0])+chips(a[1])+'</div>';
    case 'BL': return '<div class="wb">'+t(a[0])+rows(a[1])+'</div>';
    case 'C':  return '<div class="wb cta">'+esc(a[0])+'</div>';
    case 'G':  return '<div class="wb ghost" style="text-align:center">'+esc(a[0])+'</div>';
    case 'X':  return '<div class="wb ghost" style="font-size:9.4px">'+esc(a[0])+'</div>';
    case 'I':  return '<div class="wb img">'+esc(a[0]||'')+'</div>';
    case 'R':  return '<div class="r2"><div class="wb img">'+esc(a[0])+'</div><div class="wb img">'+esc(a[1])+'</div></div>';
    case 'L':  return '<div class="wb">'+rows(a[0])+'</div>';
    case 'W':  return '<div class="wb plain">'+t(a[0])+esc(a[1]||'')+'</div>';
    case 'F':  return '<div class="grow"></div>';
    case 'SC': return '<div class="scap">'+esc(a[0])+'</div>';
    case 'LIP':return '<div class="wb plain" style="border-radius:12px 12px 0 0;padding-top:5px"><div class="lip"></div>'+t(a[0])+esc(a[1]||'')+'</div>';
    default:   return '';
  }
}
function phone(s){
  const tab=s.blocks.find(b=>b.startsWith('T|'));
  const tabs=tab?'<div class="tabs">'+tab.slice(2).split(',').map(x=>{const on=x.endsWith('*');return '<div class="'+(on?'on':'')+'">'+esc(on?x.slice(0,-1):x)+'</div>';}).join('')+'</div>':'';
  return '<div class="ph"><div class="ph-st"><span>9:41</span><span>'+esc(s.bar||'')+'</span></div><div class="ph-scr">'+s.blocks.filter(b=>!b.startsWith('T|')).map(block).join('')+'</div>'+tabs+'</div>';
}

/* ---------- หน้าจอทั้งหมด ---------- */
const S={
A1:{n:'Splash',bar:'',blocks:['F','I|โลโก้ Tripster','G|Your Trip, Your Way','F','X|แตะที่ไหนก็ได้เพื่อข้าม']},
A2:{n:'หน้าต้อนรับ',bar:'',blocks:['H|จัดทริปเที่ยวไทย ให้จบใน 5 นาที|','B|1 · บอกว่าอยากไปไหน แบบไหน','B|2 · แอปจัดร่างแผนรายวันให้','B|3 · แก้เวลา นำทาง แชร์ให้เพื่อน','C|เริ่มจัดทริป','G|ข้ามไปดูที่เที่ยวก่อน','X|เคยใช้แล้ว? เข้าสู่ระบบ']},
A3:{n:'เลือกจุดหมาย',bar:'1 / 3',blocks:['W|อยากไปจังหวัดไหน?|','B|ค้นหาจังหวัด อำเภอ หรือสถานที่','G|ใกล้ฉัน · ใช้ตำแหน่งปัจจุบัน','R|ภูเก็ต · 66 ที่|เชียงใหม่','R|กระบี่|น่าน · ยังไม่ครบ','G|ดูทั้ง 77 จังหวัด','C|ถัดไป']},
A4:{n:'เลือกแนวทริป',bar:'2 / 3',blocks:['W|ไปภูเก็ตแบบไหนดี?|เลือกได้หลายแบบ','BP|แนวทริป|ทะเล*,ภูเขา,เมือง,สายกิน*,วัฒนธรรม,ชิล ๆ','BP|ไปกับใคร|ครอบครัว*,คู่รัก,เพื่อน,คนเดียว','X|เลือกครอบครัว → ลดการเดินไกล เพิ่มเวลาพักระหว่างจุด','F','C|ถัดไป']},
A5:{n:'วันเดินทาง + ชื่อทริป',bar:'3 / 3',blocks:['W|ไปวันไหน กี่วัน?|','I|ปฏิทิน — เลือกช่วงวัน','W|3 วัน 2 คืน|ศ 14 – อา 16 พ.ย.','G|ยังไม่รู้วัน จัดแบบไม่ระบุวันที่','B|ชื่อทริป|เที่ยวภูเก็ต พ.ย. 68','C|สร้างแผนให้เลย']},
A6:{n:'ร่างแผนอัตโนมัติ',bar:'ร่างแผน',blocks:['W|จัดให้แล้ว 3 วัน 14 ที่|ปรับได้ทุกอย่าง','BL|Day 1 · ศ 14 พ.ย.|2','BL|Day 2 · ส 15 พ.ย.|1','G|สลับที่อื่นให้ · จัดใหม่','C|ใช้แผนนี้','X|เริ่มจากแผนเปล่าแทน']},
B1:{n:'หน้าแรก — ยังไม่มีทริป',bar:'🔔',blocks:['H|สวัสดี · วันนี้อยากไปไหน|','W|ยังไม่มีทริป|ตอบ 3 คำถาม แล้วได้แผนเลย','C|เริ่มจัดทริปแรก','R|ภูเก็ต|เชียงใหม่','BL|ทริปที่คนอื่นจัดไว้|1','T|หน้าแรก*,สำรวจ,ทริป,บันทึก,ฉัน']},
B2:{n:'หน้าแรก — มีทริป',bar:'🔔 2',blocks:['H|เที่ยวภูเก็ต พ.ย. 68|อีก 12 วัน · 3 วัน 14 ที่','BP|ยังไม่ครบ|เติม Day 3*,หาที่พัก','BL|แก้ล่าสุด|1','BL|แนะนำเพิ่ม — สายกิน ใกล้เมืองเก่า|1','G|ทริปอื่นของฉัน (2)','T|หน้าแรก*,สำรวจ,ทริป,บันทึก,ฉัน']},
B3:{n:'โหมดระหว่างทริป',bar:'● กำลังเที่ยว',blocks:['H|Day 2 · วันนี้|เหลืออีก 4 ที่','BP|ตอนนี้ 14:30 · หาดกะตะ|นำทาง*,เช็คอินแล้ว,ข้าม','B|ถัดไป 16:00 · จุดชมวิวกะรน|ห่าง 3.2 กม. · ขับ 9 นาที','W|พระอาทิตย์ตก 18:12|ควรถึงแหลมพรหมเทพก่อน 17:40','G|ดูทั้งวัน · แผนที่เส้นทาง','X|เตือนเมื่อเข้าใกล้ · เปิดอยู่ (300 ม.)','T|หน้าแรก*,สำรวจ,ทริป,บันทึก,ฉัน']},
C1:{n:'สำรวจทั่วไทย',bar:'',blocks:['B|ค้นหาที่เที่ยว ร้านอาหาร จังหวัด','BP|อยากไปแบบไหน|ทั้งหมด*,ทะเล,ภูเขา,เมือง,สายกิน','BL|ใกล้ฉัน · ชลบุรี 82 กม.|1','R|ภูเก็ต|เชียงใหม่','BP|เลือกตามภาค|เหนือ,อีสาน,กลาง,ตะวันออก,ใต้','T|หน้าแรก,สำรวจ*,ทริป,บันทึก,ฉัน']},
C2:{n:'หน้าจังหวัด',bar:'←  ♡  ⋯',blocks:['H|ภูเก็ต|อันดามัน · ใต้ · 66 ที่','W||เมืองเก่าชิโน-โปรตุกีส ติ่มซำตั้งแต่เช้า คาเฟ่ทั้งย่าน','BP|หมวด|ที่เที่ยว 15,หาด 14,คาเฟ่ 8,ติ่มซำ 8','BL|หาด · เลื่อนดู|2','G|เลือกหลายที่พร้อมกัน','C|เริ่มจัดทริปภูเก็ต']},

 note:'<b>กติกาการก๊อป</b> ก๊อปแล้วขาดจากต้นฉบับทันที ต้นฉบับแก้ทีหลังไม่กระทบ · เก็บ forkedFrom ไว้ให้เครดิต และนับ stats.forks ให้เจ้าของเดิม'},

{id:'ontrip',name:'วันเดินทางจริง',goal:'วันที่ไปจริงคนไม่ได้อยากเห็นทั้งแผน อยากรู้แค่ "ตอนนี้ควรอยู่ไหน ไปต่อยังไง เหลืออีกกี่ที่" — แอปสลับโหมดเองตามวันที่ ไม่ต้องให้กดสลับ',
 steps:[
  {s:'B3',do:'เข้าโหมดอัตโนมัติเมื่อวันนี้อยู่ในช่วงของทริป · เช็คอิน/ข้ามได้ให้แผนขยับตามจริง',out:'→ H2 / D6'},
  {s:'H2',do:'เปิดเตือนเข้าใกล้ · บอกข้อจำกัดของเบราว์เซอร์ตรง ๆ ในหน้านี้',out:'ยังไม่ให้สิทธิ์ → I1'},

/* ---------- render ---------- */
function card(step,i){
  const s=S[step.s];
  if(!s) return '';
  return '<div class="card"><div class="card-hd">'+(i?'<span class="step">'+i+'</span>':'')+
    '<span class="sid">'+esc(step.s)+'</span><span class="nm">'+esc(s.n)+'</span></div>'+
    phone(s)+'<p class="cap">'+esc(step.do)+'<span class="out">'+esc(step.out||'')+'</span></p></div>';
}
const strip = steps => '<div class="strip">'+steps.map((st,i)=>card(st,i+1)).join('<span class="arrow" aria-hidden="true">→</span>')+'</div>';

function render(f){
  const ids=f.steps.map(s=>'<span class="pill">'+esc(s.s)+'</span>').join('<span class="arrowtx">→</span>');
  const br=f.extra.flatMap(e=>e.steps).map(s=>'<span class="pill br">'+esc(s.s)+'</span>').join('');
  let h='<div class="p-head"><span class="p-id">'+esc(f.no)+'</span><h2>'+esc(f.name)+'</h2></div>'+
    '<p class="p-goal">'+esc(f.goal)+'</p>'+
    '<div class="p-meta">'+ids+(br?'<span class="arrowtx">·  ทางแยก</span>'+br:'')+'</div>'+
    '<div class="strip-cap">เส้นทางหลัก · '+f.steps.length+' หน้า</div>'+strip(f.steps);
  f.extra.forEach(e=>{ h+='<div class="strip-cap">'+esc(e.cap)+'</div>'+strip(e.steps); });
  if(f.note) h+='<div class="note">'+f.note+'</div>';
  document.getElementById('panel').innerHTML=h;
  document.title='Tripster Flow Wireframes';
}
function select(id,push){
  const f=FLOWS.find(x=>x.id===id)||FLOWS[0];
  render(f);
  [...document.querySelectorAll('#nav button')].forEach(b=>b.setAttribute('aria-current',String(b.dataset.id===f.id)));
  if(push && location.hash!=='#'+f.id) history.replaceState(null,'','#'+f.id);
  window.scrollTo({top:0,behavior:'auto'});
}
FLOWS.forEach((f,i)=>f.no=String(i+1).padStart(2,'0'));
document.getElementById('nav').innerHTML=FLOWS.map(f=>
  '<button type="button" data-id="'+f.id+'" aria-current="false"><span class="no">'+f.no+'</span>'+
  '<span class="tx">'+esc(f.name)+'</span><span class="ct">'+(f.steps.length+f.extra.flatMap(e=>e.steps).length)+'</span></button>').join('');
document.getElementById('nav').addEventListener('click',e=>{
  const b=e.target.closest('button[data-id]');
  if(b) select(b.dataset.id,true);
});
window.addEventListener('hashchange',()=>select(location.hash.slice(1),false));
select(location.hash.slice(1)||FLOWS[0].id,false);
</script>
</body></html>
